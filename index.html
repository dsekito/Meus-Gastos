<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="icon" href="data:," />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meus Gastos</title>
    <style>
      :root {
        --ink: #102a43;
        --muted: #627d98;
        --line: #e7edf3;
        --paper: #fff;
        --bg: #f4f7fb;
        --brand: #126b5b;
        --brand-dark: #0d4f44;
        --soft: #e6f4f0;
        --danger: #b42318;
        --shadow: 0 16px 40px rgba(16, 42, 67, 0.09);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      [hidden] {
        display: none !important;
      }
      .auth-screen {
        display: grid;
        min-height: 100vh;
        padding: 24px;
        place-items: center;
      }
      .auth-card {
        width: min(100%, 390px);
        padding: 32px;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: var(--paper);
        box-shadow: var(--shadow);
        text-align: center;
      }
      .auth-logo {
        width: 50px;
        height: 50px;
        margin: 0 auto 16px;
        border-radius: 15px;
        background: var(--brand);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 25px;
      }
      .auth-card h1 {
        margin: 0;
        font-size: 24px;
      }
      .auth-card p {
        margin: 8px 0 24px;
        color: var(--muted);
      }
      .google-button {
        width: 100%;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        padding: 12px 16px;
        background: #fff;
        color: var(--ink);
        font-weight: 700;
        cursor: pointer;
      }
      .google-button:hover {
        background: #f8fafc;
      }

      .shell {
        max-width: 1180px;
        margin: auto;
        padding: 30px 22px 60px;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 30px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .mark {
        width: 42px;
        height: 42px;
        border-radius: 13px;
        background: var(--brand);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 22px;
      }
      .brand h1 {
        font-size: 22px;
        margin: 0;
        letter-spacing: -0.5px;
      }
      .brand p {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 13px;
      }
      .primary {
        border: 0;
        border-radius: 10px;
        padding: 12px 17px;
        background: var(--brand);
        color: white;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 7px 14px rgba(18, 107, 91, 0.18);
      }
      .primary:hover {
        background: var(--brand-dark);
      }
      .header-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .auth-button {
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        padding: 11px 14px;
        background: #fff;
        color: var(--ink);
        font-weight: 700;
        cursor: pointer;
      }
      .auth-button:hover {
        background: #f8fafc;
      }
      .signed-user {
        max-width: 180px;
        overflow: hidden;
        color: var(--muted);
        font-size: 13px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 16px;
        margin-bottom: 24px;
      }

      .card {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 15px;
        padding: 18px;
        box-shadow: 0 3px 12px rgba(16, 42, 67, 0.025);
      }
      .card .label {
        color: var(--muted);
        font-size: 13px;
      }
      .amount {
        font-size: 24px;
        font-weight: 750;
        letter-spacing: -1px;
        margin-top: 7px;
      }
      .amount.warn {
        color: #b54708;
      }
      .amount.good {
        color: var(--brand);
      }

      .panel {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .panel-head {
        padding: 22px 24px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .panel-head h2 {
        font-size: 18px;
        margin: 0;
      }
      .panel-head span {
        font-size: 13px;
        color: var(--muted);
      }

      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        padding: 0 24px 17px;
        border-bottom: 1px solid var(--line);
        align-items: flex-end;
      }
      .filters > * {
        flex: 1 1 180px;
      }
      .filters select,
      .filters input {
        width: 100%;
        border: 1px solid #cbd5e1;
        background: #fff;
        border-radius: 8px;
        padding: 10px 12px;
        color: var(--ink);
      }
      .selection-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .selection-toolbar {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .status-button {
        border: 0;
        background: none;
        padding: 0;
        cursor: pointer;
        font-weight: 700;
      }
      .icon-button {
        border: 0;
        background: none;
        cursor: pointer;
        font-size: 22px;
        color: var(--ink);
        padding: 6px;
        border-radius: 8px;
      }
      .icon-button:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .icon-button:not(:disabled):hover {
        background: #f3f4f6;
      }
      .paid {
        color: var(--brand);
        font-weight: 700;
      }
      .pending {
        color: #b54708;
        font-weight: 700;
      }
      .status-button:hover {
        text-decoration: underline;
      }
      .empty {
        padding: 42px 24px;
        text-align: center;
        color: var(--muted);
      }
      dialog {
        border: 0;
        padding: 0;
        border-radius: 18px;
        width: min(700px, calc(100% - 32px));
        box-shadow: 0 25px 80px rgba(16, 42, 67, 0.3);
      }
      dialog::backdrop {
        background: rgba(16, 42, 67, 0.45);
      }
      .modal {
        padding: 22px;
      }
      .modal-head {
        display: flex;
        justify-content: space-between;
        align-items: start;
        margin-bottom: 21px;
      }
      .modal h2 {
        margin: 0;
        font-size: 21px;
      }
      .modal p {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 13px;
      }
      .close {
        background: none;
        border: 0;
        font-size: 25px;
        line-height: 1;
        color: var(--muted);
        cursor: pointer;
      }
      .form-grid {
        display: grid;
        grid-template-columns: 0.95fr 1.05fr;
        gap: 14px;
        align-items: start;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 7px;
        align-self: start;
      }
      .field.wide {
        grid-column: 1/-1;
      }
      label {
        font-size: 13px;
        font-weight: 700;
      }
      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid #cbd5e1;
        border-radius: 9px;
        padding: 10px 12px;
        background: #fff;
        color: var(--ink);
      }
      textarea {
        resize: vertical;
        min-height: 68px;
      }
      .modal-foot {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 23px;
      }
      .secondary {
        border: 1px solid #cbd5e1;
        background: white;
        border-radius: 10px;
        padding: 11px 15px;
        font-weight: 700;
        color: var(--ink);
        cursor: pointer;
      }

      #installmentsField {
        align-self: start;
      }
      .toast {
        position: fixed;
        right: 22px;
        bottom: 22px;
        background: #102a43;
        color: #fff;
        padding: 13px 16px;
        border-radius: 10px;
        box-shadow: var(--shadow);
        opacity: 0;
        transform: translateY(12px);
        transition: 0.2s;
        pointer-events: none;
      }
      .toast.show {
        opacity: 1;
        transform: none;
      }

      /* =======================================================
      NOVA LISTA DE LANÇAMENTOS (FASE 1)
      ======================================================= */
      .entries {
        display: flex;
        flex-direction: column;
        background: #fff;
      }

      .entry {
        display: flex;
        gap: 14px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        background: #fff;
        transition: background 0.15s ease;
      }

      .entry:last-child {
        border-bottom: 0;
      }

      .entry:active {
        background: #f8fafc;
      }

      .entry.selected {
        background: #e6f4f0 !important;
        border-left: 4px solid var(--brand);
      }

      .entry.selected .entry-title::before {
        content: "✓";
        color: var(--brand);
        font-weight: 700;
        margin-right: 6px;
      }

      .entry-date {
        width: 42px;
        flex-shrink: 0;
        text-align: center;
      }

      .entry-day {
        display: block;
        font-size: 24px;
        font-weight: 700;
        line-height: 1;
      }

      .entry-month {
        display: block;
        margin-top: 2px;
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
      }

      .entry-content {
        flex: 1;
        min-width: 0;
      }

      .entry-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }

      .entry-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 15px;
        font-weight: 700;
      }

      .entry-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      .entry-value {
        white-space: nowrap;
        font-size: 16px;
        font-weight: 700;
      }

      .entry-description {
        margin-top: 2px;
        color: var(--muted);
        font-size: 13px;
      }

      .entry-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 6px;
      }

      .entry-meta {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
      }

      .entry-menu {
        border: 0;
        background: none;
        color: #64748b;
        font-size: 20px;
        padding: 0;
        cursor: pointer;
      }

      /* =======================================================
      MENU CONTEXTUAL
      ======================================================= */
      .context-menu {
        position: fixed;
        width: 220px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: var(--shadow);
        overflow: hidden;
        z-index: 999;
      }

      .context-menu.hidden {
        display: none;
      }

      .context-menu button {
        width: 100%;
        border: 0;
        background: #fff;
        padding: 14px 16px;
        text-align: left;
        cursor: pointer;
      }

      .context-menu button:hover {
        background: #f8fafc;
      }

      .context-menu .danger {
        color: var(--danger);
      }

      /* =======================================================
       TABLET
    ======================================================= */
      @media (max-width: 992px) {
        .top {
          flex-wrap: wrap;
        }
        .summary {
          grid-template-columns: repeat(2, 1fr);
        }
        .filters > * {
          flex: 1 1 240px;
        }
      }

      /* =======================================================
         TABLET PEQUENO
      ======================================================= */

      @media (max-width: 768px) {
        .shell {
          padding: 18px;
        }

        .top {
          flex-direction: column;
          align-items: stretch;
        }

        .brand {
          justify-content: center;
          text-align: center;
        }

        .top .primary {
          width: 100%;
        }

        .summary {
          grid-template-columns: 1fr;
        }

        dialog {
          width: calc(100% - 16px);
          margin: 8px;
          border-radius: 14px;
        }

        .modal {
          padding: 16px;
        }

        .form-grid {
          grid-template-columns: 1fr;
          gap: 14px;
        }
      }

      /* =======================================================
         CELULAR
      ======================================================= */

      @media (max-width: 576px) {
        .shell {
          padding: 14px;
        }

        .brand h1 {
          font-size: 20px;
        }

        .brand p {
          font-size: 12px;
        }

        .amount {
          font-size: 22px;
        }

        .modal {
          padding: 14px;
        }

        .modal h2 {
          font-size: 19px;
        }

        .modal p {
          font-size: 12px;
        }

        label {
          font-size: 12px;
        }

        input,
        select,
        textarea {
          padding: 10px;
          font-size: 16px;
        }

        textarea {
          min-height: 60px;
        }

        .modal-foot {
          flex-direction: column;
          gap: 8px;
        }

        .modal-foot button {
          width: 100%;
        }

        .primary,
        .secondary {
          padding: 10px 14px;
        }

        .toast {
          left: 10px;
          right: 10px;
          bottom: 10px;
        }
      }
    </style>
  </head>
  <body>
    <section class="auth-screen" id="authScreen">
      <div class="auth-card">
        <div class="auth-logo">$</div>
        <h1>Meus Gastos</h1>
        <p>Entre com sua conta Google para acessar seus lançamentos.</p>
        <button class="google-button" id="signInGoogleScreen" type="button">Continuar com Google</button>
      </div>
    </section>
    <main class="shell" id="appShell" hidden>
      <header class="top">
        <div class="brand">
          <div class="mark">$</div>
          <div>
            <h1>Meus Gastos</h1>
            <p>Seu controle financeiro, sem complicação.</p>
          </div>
        </div>
        <div class="header-actions">
          <div id="authArea"></div>
          <button class="primary" id="openModal">+ Novo lançamento</button>
        </div>
      </header>
      <section class="summary">
        <article class="card">
          <div class="label">Gastos do mês</div>
          <div class="amount warn" id="monthTotal">R$ 0,00</div>
        </article>
        <article class="card">
          <div class="label">Já pago</div>
          <div class="amount good" id="paidTotal">R$ 0,00</div>
        </article>
        <article class="card">
          <div class="label">A pagar</div>
          <div class="amount" id="pendingTotal">R$ 0,00</div>
        </article>
      </section>
      <section class="panel">
        <div class="panel-head">
          <div>
            <h2 id="panelTitle">Lançamentos</h2>
            <span id="count">0 lançamentos</span>
          </div>

          <div id="selectionActions"></div>
        </div>
        <div class="filters">
          <input id="filterMonth" type="month" aria-label="Filtrar por mês" />

          <select id="filterType">
            <option value="">Todos os tipos</option>
          </select>

          <select id="filterStatus">
            <option value="">Todos os status</option>
            <option value="paid">Pagos</option>
            <option value="pending">Em aberto</option>
          </select>
        </div>

        <div class="entries" id="rows"></div>
      </section>
    </main>
    <dialog id="entryDialog">
      <form class="modal" id="entryForm">
        <div class="modal-head">
          <div>
            <h2>Novo lançamento</h2>
            <p>Registre uma despesa ou compromisso financeiro.</p>
          </div>
          <button class="close" type="button" data-close>&times;</button>
        </div>
        <div class="form-grid">
          <div class="field">
            <label for="date">Data</label>
            <input id="date" type="date" required />
          </div>
          <div class="field">
            <label for="value">Valor (negativo para reembolso)</label>
            <input
              id="value"
              type="number"
              step="0.01"
              placeholder="Ex.: -50,00"
              required
            />
          </div>
          <div class="field">
            <label for="recurrence">Tipo do lançamento</label>
            <select id="recurrence">
              <option value="single">Único</option>
              <option value="installments">Parcelado</option>
            </select>
          </div>

          <div class="field" id="installmentsField" style="display: none">
            <label for="installments"> Número de parcelas </label>

            <input id="installments" type="number" min="2" value="2" />
          </div>

          <div class="field">
            <label for="type">Tipo</label>
            <select id="type" required></select>
          </div>

          <div class="field">
            <label for="description">Descrição</label>
            <select id="description" required></select>
          </div>
          <div class="field wide">
            <label for="detail">Detalhe (opcional)</label
            ><textarea
              id="detail"
              placeholder="Ex.: pagamento da fatura, nome da loja…"
            ></textarea>
          </div>
          <div class="field wide">
            <label
              ><input
                id="paid"
                type="checkbox"
                style="width: auto; margin-right: 8px"
              />Marcar como pago</label
            >
          </div>
        </div>
        <div class="modal-foot">
          <button class="secondary" type="button" data-close>Cancelar</button
          ><button class="primary" type="submit">Salvar lançamento</button>
        </div>
      </form>
    </dialog>

    <div id="contextMenu" class="context-menu hidden">
      <button data-action="edit">✏ Editar</button>

      <button data-action="toggle-status">✔ Alterar status</button>

      <button data-action="delete" class="danger">🗑 Excluir</button>
    </div>

    <div class="toast" id="toast"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./dados-importados.js"></script>
    <script>
      const defaultTypes = [
        "TRABALHO",
        "GAS",
        "NUBANK",
        "IPVA",
        "IPTU",
        "CONDOMINIO",
        "FINANCIAMENTO",
        "OBJETIVO",
        "PERSON",
        "FIT",
        "FRAN",
      ];
      const defaultDescriptions = [
        "TRABALHO",
        "GAS",
        "ASSINATURA",
        "CARRO",
        "CASA",
        "CONDOMINIO",
        "FINANCIAMENTO",
        "EMPRESTIMO",
        "MEL",
        "PRESENTES",
        "ROUPAS",
        "BRUNA",
        "TEC",
        "FIT",
        "COMIDA",
        "VIAGEM",
        "SAUDE",
        "RESTAURANTE",
        "BEBIDAS",
        "BARBEARIA",
        "CASHBACK",
        "FRAN",
        "RECORRENTE",
      ];

      const SUPABASE_URL = "https://gluyucuvvvfkztzjhbyj.supabase.co";
      const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_KPlZr5eXf58-6-O89Gqr0A_OKIkj_Me";
      const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
      );

      const state = {
        types:
          JSON.parse(localStorage.getItem("mg-types") || "null") ||
          defaultTypes,

        descriptions:
          JSON.parse(localStorage.getItem("mg-desc") || "null") ||
          defaultDescriptions,

        entries: JSON.parse(localStorage.getItem("mg-entries") || "[]"),

        activeEntry: null,

        editingId: null,

        selectionMode: false,

        selectedEntries: new Set(),

        user: null,

        deletedEntryIds: new Set(),
      };

      const money = (n) =>
        new Intl.NumberFormat("pt-BR", {
          style: "currency",
          currency: "BRL",
        }).format(n);

      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const CATEGORY_COLORS = {
        TRABALHO: "#F97316",
        GAS: "#8B5CF6",
        NUBANK: "#7E22CE",
        IPVA: "#DC2626",
        IPTU: "#B45309",
        CONDOMINIO: "#16A34A",
        FINANCIAMENTO: "#4B5563",
        OBJETIVO: "#EAB308",
        PERSON: "#EC4899",
        FIT: "#22C55E",
        FRAN: "#06B6D4",
      };

      function categoryColor(type) {
        return CATEGORY_COLORS[type] || "#64748B";
      }

      const dialog = document.querySelector("#entryDialog"),
        form = document.querySelector("#entryForm"),
        modalTitle = document.querySelector(".modal h2"),
        dateInput = document.querySelector("#date"),
        valueInput = document.querySelector("#value"),
        detailInput = document.querySelector("#detail"),
        paidInput = document.querySelector("#paid"),
        type = document.querySelector("#type"),
        desc = document.querySelector("#description"),
        recurrence = document.querySelector("#recurrence"),
        installments = document.querySelector("#installments"),
        installmentsField = document.querySelector("#installmentsField"),
        filterType = document.querySelector("#filterType"),
        filterMonth = document.querySelector("#filterMonth"),
        filterStatus = document.querySelector("#filterStatus"),
        monthTotal = document.querySelector("#monthTotal"),
        paidTotal = document.querySelector("#paidTotal"),
        pendingTotal = document.querySelector("#pendingTotal"),
        count = document.querySelector("#count"),
        panelTitle = document.querySelector("#panelTitle"),
        toast = document.querySelector("#toast"),
        selectionActions = document.querySelector("#selectionActions"),
        openModal = document.querySelector("#openModal"),
        rows = document.querySelector("#rows"),
        contextMenu = document.querySelector("#contextMenu"),
        authArea = document.querySelector("#authArea"),
        authScreen = document.querySelector("#authScreen"),
        appShell = document.querySelector("#appShell"),
        signInGoogleScreen = document.querySelector("#signInGoogleScreen");

      selectionActions.onclick = (e) => {
        e.stopPropagation();

        if (e.target.closest("#exitSelection")) {
          exitSelectionMode();
          return;
        }

        if (e.target.closest("#selectAll")) {
          selectAllFiltered();
          return;
        }

        if (e.target.closest("#deleteSelection")) {
          deleteSelectedEntries();
          return;
        }

        if (e.target.closest("#markPaidSelection")) {
          markSelectedAsPaid();
          return;
        }

        if (e.target.closest("#markPendingSelection")) {
          markSelectedAsPending();
          return;
        }
      };

      function saveLocal() {
        localStorage.setItem("mg-types", JSON.stringify(state.types));
        localStorage.setItem("mg-desc", JSON.stringify(state.descriptions));
        localStorage.setItem("mg-entries", JSON.stringify(state.entries));
        if (state.user) localStorage.setItem("mg-user-id", state.user.id);
      }

      function save() {
        saveLocal();
        syncEntries().catch((error) => {
          console.error(error);
          show(
            "Alteração salva neste aparelho. A sincronização será tentada novamente.",
          );
        });
      }

      function updateAuthArea() {
        authScreen.hidden = !!state.user;
        appShell.hidden = !state.user;
        if (!state.user) {
          authArea.innerHTML =
            '<button class="auth-button" id="signInGoogle" type="button">Entrar com Google</button>';
          return;
        }

        const name = state.user.user_metadata?.full_name || state.user.email;
        authArea.innerHTML = `<span class="signed-user" title="${esc(state.user.email || "")}">${esc(name || "Usuário")}</span><button class="auth-button" id="signOut" type="button">Sair</button>`;
      }

      async function syncEntries() {
        if (!state.user) return;

        const deletedIds = [...state.deletedEntryIds];
        if (deletedIds.length) {
          const { error } = await supabaseClient
            .from("entries")
            .delete()
            .in("id", deletedIds);
          if (error) throw error;
          deletedIds.forEach((id) => state.deletedEntryIds.delete(id));
        }

        if (!state.entries.length) return;

        const entries = state.entries.map((entry) => ({
          ...entry,
          user_id: state.user.id,
        }));
        const { error } = await supabaseClient.from("entries").upsert(entries);
        if (error) throw error;
      }

      async function loadCloudEntries() {
        const { data, error } = await supabaseClient
          .from("entries")
          .select(
            "id, date, value, type, description, detail, paid, installment",
          )
          .order("date", { ascending: true });
        if (error) throw error;

        if (data.length) {
          state.entries = data;
          state.types = [
            ...new Set([...state.types, ...data.map((entry) => entry.type)]),
          ].sort();
          state.descriptions = [
            ...new Set([
              ...state.descriptions,
              ...data.map((entry) => entry.description),
            ]),
          ].sort();
          saveLocal();
          render();
          show("Lançamentos sincronizados.");
          return;
        }

        const savedUserId = localStorage.getItem("mg-user-id");
        const canMigrateLocalEntries =
          !savedUserId || savedUserId === state.user.id;
        if (state.entries.length && canMigrateLocalEntries) {
          await syncEntries();
          show("Lançamentos deste aparelho foram enviados para sua conta.");
        } else if (!canMigrateLocalEntries) {
          state.entries = [];
          saveLocal();
          render();
        }
      }

      async function setCurrentUser(user) {
        if (state.user?.id === user?.id) return;
        state.user = user || null;
        updateAuthArea();
        if (state.user) await loadCloudEntries();
      }

      async function signInWithGoogle() {
        if (window.location.protocol === "file:") {
          show("Abra o site publicado para entrar com Google.");
          return;
        }
        const { error } = await supabaseClient.auth.signInWithOAuth({
          provider: "google",
          options: { redirectTo: window.location.href },
        });
        if (error) show(`Não foi possível iniciar o login: ${error.message}`);
      }

      async function signOut() {
        const { error } = await supabaseClient.auth.signOut();
        if (error) {
          show(`Não foi possível sair: ${error.message}`);
          return;
        }
        state.user = null;
        updateAuthArea();
        show("Sessão encerrada.");
      }

      async function initializeAuth() {
        updateAuthArea();
        const { data, error } = await supabaseClient.auth.getSession();
        if (error) {
          show("Não foi possível verificar o login.");
          return;
        }
        await setCurrentUser(data.session?.user);
        supabaseClient.auth.onAuthStateChange((event, session) => {
          if (event === "SIGNED_OUT") {
            state.user = null;
            updateAuthArea();
            return;
          }
          if (event === "SIGNED_IN") {
            setCurrentUser(session?.user).catch((error) => {
              console.error(error);
              show("Não foi possível carregar seus lançamentos.");
            });
          }
        });
      }

      authArea.onclick = async (event) => {
        if (event.target.closest("#signInGoogle")) await signInWithGoogle();
        if (event.target.closest("#signOut")) await signOut();
      };

      signInGoogleScreen.onclick = () => signInWithGoogle();

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState !== "visible" || !state.user) return;
        loadCloudEntries().catch((error) => console.error(error));
      });
      function fill(select, values, placeholder) {
        select.innerHTML =
          `<option value="">${placeholder}</option>` +
          values.map((x) => `<option>${esc(x)}</option>`).join("") +
          '<option value="__new__">＋ Adicionar nova opção…</option>';
      }
      function formatDay(date) {
        return new Date(date + "T12:00").toLocaleDateString("pt-BR", {
          day: "2-digit",
        });
      }

      function formatMonth(date) {
        return new Date(date + "T12:00")
          .toLocaleDateString("pt-BR", {
            month: "short",
          })
          .replace(".", "")
          .toUpperCase();
      }
      function renderEntry(e) {
        return `
      <div
        class="entry ${state.selectedEntries.has(e.id) ? "selected" : ""}"
        data-entry="${e.id}">
          <div class="entry-date">
              <span class="entry-day">
                  ${formatDay(e.date)}
              </span>
              <span class="entry-month">
                  ${formatMonth(e.date)}
              </span>
          </div>
          <div class="entry-content">
              <div class="entry-header">
                  <div class="entry-title">
                      <span
                          class="entry-dot"
                          style="background:${categoryColor(e.type)}">
                      </span>
                      ${esc(e.type)}
                  </div>
                  <div class="entry-value">
                      ${money(e.value)}
                  </div>
              </div>
              <div class="entry-description">
                ${esc(e.description)}
                ${e.detail ? ` - ${esc(e.detail)}` : ""}
              </div>
              <div class="entry-footer">
                  <div class="entry-meta">
                      ${
                        state.selectionMode
                          ? ""
                          : `
                      <button
                          class="status-button ${e.paid ? "paid" : "pending"}"
                          data-toggle-status="${e.id}">
                          ${e.paid ? "✔ Pago" : "○ Em aberto"}
                      </button>
                      `
                      }

                      ${
                        e.installment
                          ? `<span>${e.installment.current}/${e.installment.total}</span>`
                          : ""
                      }
                  </div>
                  ${
                    state.selectionMode
                      ? ""
                      : `
                  <button
                      class="entry-menu"
                      data-edit="${e.id}">
                      ⋮
                  </button>
                  `
                  }
              </div>
          </div>
      </div>
      `;
      }

      function updateSummary(entries) {
        monthTotal.textContent = money(
          entries.reduce((a, e) => a + e.value, 0),
        );

        paidTotal.textContent = money(
          entries.filter((e) => e.paid).reduce((a, e) => a + e.value, 0),
        );

        pendingTotal.textContent = money(
          entries.filter((e) => !e.paid).reduce((a, e) => a + e.value, 0),
        );
      }

      function renderFilterTypes() {
        const selected = filterType.value;

        filterType.innerHTML =
          '<option value="">Todos os tipos</option>' +
          state.types.map((x) => `<option>${esc(x)}</option>`).join("");

        filterType.value = selected;
      }

      function getMonthlyEntries(month) {
        return state.entries.filter((e) => e.date.slice(0, 7) === month);
      }

      function getFilteredEntries(entries, type, status) {
        return entries
          .filter(
            (e) =>
              (!type || e.type === type) &&
              (!status || (status === "paid") === e.paid),
          )
          .sort((a, b) => a.date.localeCompare(b.date));
      }

      function updateCount(entries) {
        count.textContent = `${entries.length} lançamento${entries.length === 1 ? "" : "s"}`;
      }

      function renderEntries(entries) {
        rows.innerHTML = entries.length
          ? entries.map(renderEntry).join("")
          : '<div class="empty">Nenhum lançamento encontrado.</div>';
      }

      function render() {
        fill(type, state.types, "Selecione");
        fill(desc, state.descriptions, "Selecione");

        renderFilterTypes();

        const ft = filterType.value,
          fs = filterStatus.value;

        const current = new Date().toISOString().slice(0, 7);

        if (!filterMonth.value) filterMonth.value = current;

        const month = filterMonth.value;

        const monthly = getMonthlyEntries(month);

        updateSummary(monthly);

        const list = getFilteredEntries(monthly, ft, fs);

        updateCount(list);

        renderEntries(list);

        panelTitle.textContent = state.selectionMode
          ? `${state.selectedEntries.size} selecionado${state.selectedEntries.size > 1 ? "s" : ""}`
          : "Lançamentos";

        count.style.display = state.selectionMode ? "none" : "";

        let hasPendingSelection = false;

        if (state.selectionMode) {
          hasPendingSelection = state.entries.some(
            (entry) => state.selectedEntries.has(entry.id) && !entry.paid,
          );
        }

        selectionActions.innerHTML = state.selectionMode
          ? `
          <div class="selection-actions">

              <button
                  id="exitSelection"
                  class="icon-button"
                  title="Cancelar seleção">
                  ←
              </button>
              ${
                list.length === 0
                  ? ""
                  : list.every((entry) => state.selectedEntries.has(entry.id))
                    ? `
                              <button
                                  id="selectAll"
                                  class="icon-button"
                                  title="Desmarcar todos">
                                  ☒
                              </button>
                          `
                    : `
                              <button
                                  id="selectAll"
                                  class="icon-button"
                                  title="Selecionar todos">
                                  ☑
                              </button>
                          `
              }
              <div class="selection-toolbar">

                  ${
                    hasPendingSelection
                      ? `
                      <button
                          id="markPaidSelection"
                          class="icon-button"
                          title="Marcar como pago">
                          ✔
                      </button>
                      `
                      : `
                      <button
                          id="markPendingSelection"
                          class="icon-button"
                          title="Marcar como pendente">
                          ↺
                      </button>
                      `
                  }

                  <button
                      id="deleteSelection"
                      class="icon-button"
                      title="Excluir selecionados">
                      🗑
                  </button>

              </div>

          </div>
          `
          : "";
      }

      function markSelectedAsPaid() {
        let changed = 0;

        for (const entry of state.entries) {
          if (!state.selectedEntries.has(entry.id)) {
            continue;
          }

          if (!entry.paid) {
            entry.paid = true;
            changed++;
          }
        }

        if (changed > 0) {
          save();
        }

        exitSelectionMode();

        show(
          changed === 0
            ? "Os lançamentos selecionados já estavam pagos."
            : `${changed} lançamento${changed !== 1 ? "s" : ""} marcado${changed !== 1 ? "s" : ""} como pago.`,
        );
      }

      function markSelectedAsPending() {
        let changed = 0;

        for (const entry of state.entries) {
          if (!state.selectedEntries.has(entry.id)) {
            continue;
          }

          if (entry.paid) {
            entry.paid = false;
            changed++;
          }
        }

        if (changed > 0) {
          save();
        }

        exitSelectionMode();

        show(
          changed === 0
            ? "Os lançamentos selecionados já estavam pendentes."
            : `${changed} lançamento${changed !== 1 ? "s" : ""} marcado${changed !== 1 ? "s" : ""} como pendente.`,
        );
      }

      function selectAllFiltered() {
        const list = getFilteredEntries(
          getMonthlyEntries(filterMonth.value),
          filterType.value,
          filterStatus.value,
        );

        const allSelected =
          list.length > 0 &&
          list.every((entry) => state.selectedEntries.has(entry.id));

        if (allSelected) {
          list.forEach((entry) => {
            state.selectedEntries.delete(entry.id);
          });

          if (state.selectedEntries.size === 0) {
            exitSelectionMode();
            return;
          }
        } else {
          list.forEach((entry) => {
            state.selectedEntries.add(entry.id);
          });
        }

        render();
      }

      function openNew() {
        state.editingId = null;
        modalTitle.textContent = "Novo lançamento";
        form.reset();
        installmentsField.style.display = "none";
        recurrence.value = "single";
        installments.value = 2;
        dateInput.value = new Date().toISOString().slice(0, 10);
        render();
        dialog.showModal();
      }

      function addOption(event, key, select) {
        if (event.target.value !== "__new__") return;
        const label = key === "types" ? "novo tipo" : "nova descrição";
        const value = prompt(`Digite a ${label}:`);
        if (value && value.trim()) {
          const clean = value.trim().toUpperCase();
          if (!state[key].includes(clean)) state[key].push(clean);
          save();
          fill(select, state[key], "Selecione");
          select.value = clean;
          show("Opção adicionada à lista.");
        } else select.value = "";
      }
      function addMonths(dateString, months) {
        const d = new Date(dateString + "T12:00");
        d.setMonth(d.getMonth() + months);
        return d.toISOString().slice(0, 10);
      }
      function show(msg) {
        toast.textContent = msg;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2400);
      }

      function enterSelectionMode(id) {
        state.selectionMode = true;
        state.selectedEntries.clear();
        state.selectedEntries.add(id);

        render();
      }

      function exitSelectionMode() {
        state.selectionMode = false;

        state.selectedEntries.clear();

        render();
      }

      function toggleSelection(id) {
        if (state.selectedEntries.has(id)) {
          state.selectedEntries.delete(id);
        } else {
          state.selectedEntries.add(id);
        }

        if (state.selectedEntries.size === 0) {
          exitSelectionMode();
          return;
        }

        render();
      }

      function openContextMenu(button, id) {
        state.activeEntry = id;
        const rect = button.getBoundingClientRect();
        contextMenu.style.left = `${Math.min(rect.right - 220, window.innerWidth - 230)}px`;
        contextMenu.style.top = `${rect.bottom + 6}px`;
        contextMenu.classList.remove("hidden");
      }

      function closeContextMenu() {
        contextMenu.classList.add("hidden");
      }

      function handleMenuAction(action) {
        closeContextMenu();
        switch (action) {
          case "edit":
            editEntry();
            break;
          case "toggle-status":
            toggleEntryStatus();
            break;
          case "delete":
            deleteEntry();
            break;
        }
      }

      function getActiveEntry() {
        return state.entries.find((e) => e.id === state.activeEntry);
      }

      function editEntry() {
        const entry = getActiveEntry();
        if (!entry) return;
        state.editingId = entry.id;
        modalTitle.textContent = "Editar lançamento";
        fillForm(entry);
        dialog.showModal();
      }

      function generateId() {
        return crypto.randomUUID
          ? crypto.randomUUID()
          : Date.now().toString(36) + Math.random().toString(36).slice(2);
      }

      function updateEntry(entry) {
        const index = state.entries.findIndex((e) => e.id === state.editingId);
        if (index < 0) return false;
        state.entries[index] = {
          ...state.entries[index],
          ...entry,
        };
        state.editingId = null;
        return true;
      }

      function createEntry(entry) {
        if (recurrence.value === "single") {
          state.entries.push({
            id: generateId(),
            ...entry,
          });
          return;
        }
        const qty = Math.max(2, Number(installments.value));
        const installmentValue = Math.floor((entry.value / qty) * 100) / 100;
        let remaining = entry.value;
        for (let i = 0; i < qty; i++) {
          const value =
            i === qty - 1 ? Number(remaining.toFixed(2)) : installmentValue;
          remaining -= value;
          state.entries.push({
            id: generateId(),
            ...entry,
            date: addMonths(entry.date, i),
            value,
            paid: false,
            installment: {
              current: i + 1,
              total: qty,
              original: entry.value,
            },
          });
        }
      }

      function toggleEntryStatus() {
        const entry = getActiveEntry();
        if (!entry) return;
        entry.paid = !entry.paid;
        closeContextMenu();
        save();
        render();
        show(
          entry.paid
            ? "Lançamento marcado como pago."
            : "Lançamento marcado como pendente.",
        );
      }

      function deleteEntry() {
        const entry = getActiveEntry();
        if (!entry) return;
        if (!confirm("Deseja realmente excluir este lançamento?")) return;
        state.entries = state.entries.filter((e) => e.id !== entry.id);
        state.deletedEntryIds.add(entry.id);
        closeContextMenu();
        save();
        render();
        show("Lançamento excluído.");
      }

      function deleteSelectedEntries() {
        const total = state.selectedEntries.size;

        if (total === 0) {
          exitSelectionMode();
          return;
        }

        if (
          !confirm(
            `Deseja realmente excluir ${total} lançamento${total > 1 ? "s" : ""}?`,
          )
        ) {
          return;
        }

        state.entries = state.entries.filter(
          (entry) => !state.selectedEntries.has(entry.id),
        );
        state.selectedEntries.forEach((id) => state.deletedEntryIds.add(id));

        save();

        exitSelectionMode();

        show(
          `${total} lançamento${total > 1 ? "s" : ""} excluído${total > 1 ? "s" : ""}.`,
        );
      }
      function fillForm(entry) {
        dateInput.value = entry.date;
        valueInput.value = entry.value;
        type.value = entry.type;
        desc.value = entry.description;
        detailInput.value = entry.detail;
        paidInput.checked = entry.paid;
        recurrence.value = entry.installment ? "installments" : "single";
        installmentsField.style.display = entry.installment ? "" : "none";
        installments.value = entry.installment?.total ?? 2;
      }

      openModal.onclick = openNew;
      document
        .querySelectorAll("[data-close]")
        .forEach((b) => (b.onclick = () => dialog.close()));
      type.onchange = (e) => addOption(e, "types", type);
      desc.onchange = (e) => addOption(e, "descriptions", desc);
      recurrence.onchange = () => {
        installmentsField.style.display =
          recurrence.value === "installments" ? "" : "none";
      };

      [filterMonth, filterType, filterStatus].forEach((control) => {
        control.onchange = () => {
          state.selectedEntries.clear();
          state.selectionMode = false;
          render();
        };
      });

      contextMenu.onclick = (e) => {
        const button = e.target.closest("[data-action]");
        if (!button) return;
        handleMenuAction(button.dataset.action);
      };

      let pressTimer = null;
      let longPressTriggered = false;

      rows.addEventListener("pointerdown", (e) => {
        const card = e.target.closest("[data-entry]");

        if (!card) return;

        if (e.target.closest(".entry-menu")) return;

        if (e.target.closest(".status-button")) return;

        if (state.selectionMode) return;

        pressTimer = setTimeout(() => {
          longPressTriggered = true;

          enterSelectionMode(card.dataset.entry);
        }, 500);
      });

      rows.addEventListener("pointerup", () => {
        clearTimeout(pressTimer);
      });

      rows.addEventListener("pointerleave", () => {
        clearTimeout(pressTimer);
      });

      rows.addEventListener("pointercancel", () => {
        clearTimeout(pressTimer);
      });

      rows.addEventListener("click", (e) => {
        const card = e.target.closest("[data-entry]");

        if (!card) return;

        if (longPressTriggered) {
          longPressTriggered = false;
          e.preventDefault();
          return;
        }

        if (state.selectionMode) {
          toggleSelection(card.dataset.entry);

          return;
        }

        const status = e.target.closest("[data-toggle-status]");

        if (status) {
          state.activeEntry = status.dataset.toggleStatus;

          toggleEntryStatus();

          return;
        }

        const menu = e.target.closest("[data-edit]");

        if (menu) {
          openContextMenu(menu, menu.dataset.edit);
        }
      });

      form.onsubmit = (e) => {
        e.preventDefault();

        const editing = !!state.editingId;

        const date = dateInput.value;
        const totalValue = Number(valueInput.value);
        const detail = detailInput.value.trim();
        const paid = paidInput.checked;

        const entry = {
          date,
          value: totalValue,
          type: type.value,
          description: desc.value,
          detail,
          paid,
        };

        if (editing) {
          if (!updateEntry(entry)) return;
        } else {
          createEntry(entry);
        }

        save();
        dialog.close();
        render();

        show(editing ? "Lançamento atualizado." : "Lançamento salvo.");
      };

      async function startApp() {
        render();
        await initializeAuth();
        window.MEUS_GASTOS_IMPORT?.then((entries) => {
          if (state.user || localStorage.getItem("mg-imported") === "1") return;
          state.entries = entries;
          state.types = [
            ...new Set([...state.types, ...entries.map((e) => e.type)]),
          ].sort();
          state.descriptions = [
            ...new Set([
              ...state.descriptions,
              ...entries.map((e) => e.description),
            ]),
          ].sort();
          localStorage.setItem("mg-imported", "1");
          save();
          render();
          show(`${entries.length} registros importados.`);
        }).catch(() =>
          show("Não foi possível carregar os registros importados."),
        );
      }

      startApp();
    </script>
  </body>
</html>
